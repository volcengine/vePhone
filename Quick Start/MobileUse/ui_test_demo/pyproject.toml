[project]
name = "mua-automation-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<24",
  "cryptography>=45,<46",
  "croniter>=3.0,<4.0",
  "fastapi>=0.116,<0.117",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.35,<0.36",
  "volcengine-python-sdk>=5,<6",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mua_platform"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
